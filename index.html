<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MedPred CRM — Yuklanmoqda...</title>
  <meta name="theme-color" content="#0c6f78">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MedPred CRM">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="text-align:center;">
      <div class="brand-mark" style="margin:0 auto 14px;">M</div>
      <h1 style="font-size:18px;margin-bottom:6px;">MedPred CRM</h1>
      <p class="text-muted" style="margin:0;">Sessiya tekshirilmoqda...</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/permissions.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script>
    (async () => {
      const user = await window.Auth.loadCurrentUser();
      if (!user) {
        window.location.replace("login.html");
        return;
      }
      window.location.replace(window.RBAC.getDefaultHome(user.role, false));
    })();
  </script>
</body>
</html>
